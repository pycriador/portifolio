standard: "Documentation Standard v1.0"
updated: "2026-08-17"
purpose: |
  Apontador legível por máquina para manifestos por idioma.
  Não é um mecanismo de busca, índice RAG ou loja de embeddings.
languages:
  - id: en
    name: English
    manifest: en/manifest.yaml
    index: en/README.md
    ai_entry: en/ai-context.md
  - id: pt-BR
    name: Português (Brasil)
    manifest: pt-BR/manifest.yaml
    index: pt-BR/README.md
    ai_entry: pt-BR/ai-context.md
default_language: en
